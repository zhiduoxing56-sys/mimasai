<text x="456.2" y="717" class="tick" text-anchor="middle">5.5</text>
<text x="787.5" y="717" class="tick" text-anchor="middle">9</text>
<text x="1118.8" y="717" class="tick" text-anchor="middle">12.5</text>
<text x="1450.0" y="717" class="tick" text-anchor="middle">16</text>
<line x1="125" y1="145" x2="125" y2="685" stroke="#17324d" stroke-width="2"/>
<line x1="125" y1="685" x2="1450" y2="685" stroke="#17324d" stroke-width="2"/>
<text x="750.0" y="770" class="axis" text-anchor="middle">平均非自环节点度</text>
<text x="125" y="133" class="axis">在线时间（秒）</text>
<polyline points="125.0,150.3 314.3,155.2 692.9,153.5 1450.0,145.0" fill="none" stroke="#0d6173" stroke-width="4"/>
<circle cx="125.0" cy="150.3" r="6" fill="#0d6173"/>
