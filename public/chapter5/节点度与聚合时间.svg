<line x1="125" x2="1450" y1="577.0" y2="577.0" stroke="#dbe5ec"/>
<text x="109" y="583.0" class="tick" text-anchor="end">0.48</text>
<line x1="125" x2="1450" y1="469.0" y2="469.0" stroke="#dbe5ec"/>
<text x="109" y="475.0" class="tick" text-anchor="end">0.96</text>
<line x1="125" x2="1450" y1="361.0" y2="361.0" stroke="#dbe5ec"/>
<text x="109" y="367.0" class="tick" text-anchor="end">1.44</text>
<line x1="125" x2="1450" y1="253.0" y2="253.0" stroke="#dbe5ec"/>
<text x="109" y="259.0" class="tick" text-anchor="end">1.92</text>
<line x1="125" x2="1450" y1="145.0" y2="145.0" stroke="#dbe5ec"/>
