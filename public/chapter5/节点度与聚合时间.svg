<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img">
<title>节点度与安全聚合时间</title>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17324d}.title{font-size:38px;font-weight:700}.sub{font-size:20px;fill:#52677a}.axis{font-size:20px}.legend{font-size:21px}.tick{font-size:17px}</style>
<rect width="100%" height="100%" fill="#fff"/>
<text x="125" y="62" class="title">节点度与安全聚合时间</text>
<text x="125" y="104" class="sub">固定 64 节点、1 列、BFV 参数；每点为一次独立会话，HE 与共享密集矩阵均逐值通过</text>
<line x1="125" x2="1450" y1="685.0" y2="685.0" stroke="#dbe5ec"/>
