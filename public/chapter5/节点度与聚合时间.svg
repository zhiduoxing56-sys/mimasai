<polyline points="125.0,485.9 314.3,484.0 692.9,490.3 1450.0,483.7" fill="none" stroke="#cb692b" stroke-width="4"/>
<circle cx="125.0" cy="485.9" r="6" fill="#cb692b"/>
<circle cx="314.3" cy="484.0" r="6" fill="#cb692b"/>
<circle cx="692.9" cy="490.3" r="6" fill="#cb692b"/>
