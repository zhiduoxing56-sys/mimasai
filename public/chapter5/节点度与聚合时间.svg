<circle cx="692.9" cy="153.5" r="6" fill="#0d6173"/>
<circle cx="1450.0" cy="145.0" r="6" fill="#0d6173"/>
<line x1="125" x2="160" y1="722" y2="722" stroke="#0d6173" stroke-width="5"/>
